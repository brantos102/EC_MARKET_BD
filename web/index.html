<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimarket El Cultivo | Sistema de Gestión</title>
  <link rel="icon" href="img/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <meta name="theme-color" content="#013D10" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Pantalla de login -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <img src="img/logo.png" alt="Minimarket El Cultivo" class="login-logo" />
      <p class="subtitle">Frescura y calidad en cada compra</p>
      <label for="login-email">Correo</label>
      <input type="email" id="login-email" required autocomplete="username" />
      <label for="login-password">Contraseña</label>
      <input type="password" id="login-password" required autocomplete="current-password" />
      <button type="submit">Ingresar</button>
      <p id="login-error" class="form-msg error"></p>
      <p class="login-hint">
        El primer usuario se crea en Supabase &gt; Authentication &gt; Users; desde ahí
        los demás se crean en Administración (ver PUBLICACION.md).
      </p>
      <button type="button" id="btn-conexion" class="enlace-sobrio">
        Configurar la conexión a la base
      </button>
    </form>
  </div>

  <!-- Pantalla de conexión y asistente de instalación. Ocupa toda la
       ventana porque mientras se instala no hay menú ni sesión que
       mostrar al lado. -->
  <div id="instalador-screen" class="instalador-screen hidden">
    <div class="inst-cabecera">
      <img src="img/logo-menu.png" alt="" class="inst-logo" />
      <div>
        <strong id="inst-titulo">Instalación del sistema</strong>
        <span id="inst-subtitulo">Centro de Control</span>
      </div>
      <button type="button" id="inst-salir" class="enlace-sobrio hidden">Salir</button>
    </div>
    <div id="instalador-contenido"></div>
  </div>

  <!-- Shell principal -->
  <div id="app-shell" class="app-shell hidden">
    <!-- Menú lateral fijo -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <img src="img/logo-menu.png" alt="Minimarket El Cultivo" class="logo-menu" />
        <span class="lema">Frescura y calidad en cada compra</span>
        <span class="sede-chip hidden" id="sede-actual"></span>
      </div>

      <!-- El menú se arma en tiempo de ejecución desde fn_mis_modulos():
           cada rol ve solo lo suyo y el administrador cambia la matriz de
           permisos sin que nadie toque este archivo. -->
      <div class="nav-modulos" id="nav-modulos">
        <p class="nav-cargando">Cargando menú…</p>
      </div>

      <div class="sidebar-footer">
        <button id="btn-consulta-global" type="button" class="btn-consulta-lateral"
                title="Abre una ventana flotante de consulta que se queda abierta al cambiar de módulo">
          Consulta rápida <kbd>F2</kbd>
        </button>
        <button id="btn-perfil" type="button" class="btn-perfil" title="Ver mi perfil y permisos">
          <span class="perfil-avatar" id="perfil-inicial">·</span>
          <span class="perfil-datos">
            <span id="current-user-email"></span>
            <span id="rol-actual" class="rol-chip"></span>
          </span>
        </button>
        <button id="logout-btn" type="button">Salir</button>
      </div>
    </nav>

    <!-- Contenido -->
    <main class="main-content">
      <h1 id="page-title">Dashboard</h1>
      <div id="content"></div>
    </main>
  </div>

  <script src="js/vendor/supabase.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
